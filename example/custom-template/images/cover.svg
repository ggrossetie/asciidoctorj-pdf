<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0b4f6c"/>
      <stop offset="1" stop-color="#062c3d"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b705"/>
      <stop offset="1" stop-color="#f2b705" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="0.45" fill="#ffffff" fill-opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="210" height="297" fill="url(#sky)"/>
  <rect width="210" height="297" fill="url(#dots)"/>
  <!-- rings around the sun -->
  <g fill="none" stroke="#f2b705">
    <circle cx="168" cy="62" r="22" stroke-width="0" fill="#f2b705"/>
    <circle cx="168" cy="62" r="34" stroke-width="0.8" stroke-opacity="0.8"/>
    <circle cx="168" cy="62" r="48" stroke-width="0.6" stroke-opacity="0.5"/>
    <circle cx="168" cy="62" r="64" stroke-width="0.4" stroke-opacity="0.3"/>
    <circle cx="168" cy="62" r="82" stroke-width="0.3" stroke-opacity="0.15"/>
  </g>
  <!-- the quarter as rising bars -->
  <g fill="url(#bar)">
    <rect x="24" y="196" width="18" height="101" rx="2"/>
    <rect x="50" y="178" width="18" height="119" rx="2"/>
    <rect x="76" y="186" width="18" height="111" rx="2"/>
    <rect x="102" y="158" width="18" height="139" rx="2"/>
    <rect x="128" y="136" width="18" height="161" rx="2"/>
    <rect x="154" y="112" width="18" height="185" rx="2"/>
  </g>
  <!-- the trend -->
  <polyline points="33,184 59,166 85,174 111,146 137,124 163,100 190,78" fill="none" stroke="#ffffff"
    stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0b4f6c" stroke="#ffffff" stroke-width="1.2">
    <circle cx="33" cy="184" r="2.4"/>
    <circle cx="59" cy="166" r="2.4"/>
    <circle cx="85" cy="174" r="2.4"/>
    <circle cx="111" cy="146" r="2.4"/>
    <circle cx="137" cy="124" r="2.4"/>
    <circle cx="163" cy="100" r="2.4"/>
  </g>
  <path d="M195.4,73.6 L192,80.5 L188,75.5 Z" fill="#ffffff"/>
  <!-- a band at the bottom -->
  <rect y="281" width="210" height="16" fill="#062c3d" fill-opacity="0.85"/>
  <rect x="24" y="288" width="30" height="2" fill="#f2b705"/>
</svg>
