name: Install the dependencies
description: Builds AsciidoctorJ 4 from source and installs it in the local Maven repository

runs:
  using: composite
  steps:
    # AsciidoctorJ 4 is not published yet: build it from source.
    - name: Checkout AsciidoctorJ
      uses: actions/checkout@v7
      with:
        repository: ggrossetie/asciidoctorj
        ref: asciidoctorj-4
        path: deps/asciidoctorj
    # Gradle 8.12 does not run on Java 25: build with Java 21, then restore the Java of the job
    - name: Save the Java of the job
      id: job-java
      shell: bash
      run: echo "home=$JAVA_HOME" >> "$GITHUB_OUTPUT"
    - name: Set up Java 21
      id: java21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
    - name: Install AsciidoctorJ
      shell: bash
      run: ./gradlew --no-daemon :asciidoctorj-api:publishToMavenLocal :asciidoctorj-java:publishToMavenLocal
      env:
        JAVA_HOME: ${{ steps.java21.outputs.path }}
      working-directory: deps/asciidoctorj
    - name: Restore the Java of the job
      shell: bash
      env:
        JOB_JAVA_HOME: ${{ steps.job-java.outputs.home }}
      run: |
        echo "JAVA_HOME=$JOB_JAVA_HOME" >> "$GITHUB_ENV"
        echo "$JOB_JAVA_HOME/bin" >> "$GITHUB_PATH"
