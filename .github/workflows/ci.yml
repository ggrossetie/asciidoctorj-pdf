name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress

jobs:
  build:
    name: build (Java ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        # the minimum supported version and the latest LTS version
        java: ['17', '25']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: ./.github/actions/install-dependencies

      - name: Build and test
        run: mvn verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: target/surefire-reports/

  native:
    name: native-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          cache: maven
      - uses: ./.github/actions/install-dependencies

      # Builds the tests as a native image and runs them: checks the reachability metadata
      - name: Test in a native image
        run: mvn -Pnative test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-native
          path: target/native-test-reports/
